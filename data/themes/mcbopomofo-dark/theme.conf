# McBopomofo Dark: candidate panel colors of McBopomofo on macOS in dark mode
# (the system colors its panels use). No font is set, so that the font and
# its size stay with the classic user interface settings. No images are
# shipped: the panel is drawn in plain colors, and the page, check and
# submenu marks are those of the default fcitx theme.
#
# Colors, from the macOS system colors in dark mode:
#   background     popover material (#2c2c2c)
#   border         separatorColor over the background (#414141)
#   text           labelColor over the background (#dfdfdf)
#   highlight      controlAccentColor (#0a84ff) with white text, as the
#                  candidate and symbol table panels draw the chosen item;
#                  follows the desktop accent color when the classic user
#                  interface is set to follow the system accent color
#   marked text    selectedTextBackgroundColor (#3f638b) and
#                  selectedTextColor (#ffffff)

[Metadata]
Name=McBopomofo Dark
Name[zh_TW]=小麥注音深色
Version=1
Author=McBopomofo Smart Learning
Description=Candidate panel in the colors of McBopomofo on macOS, dark
Description[zh_TW]=小麥注音 macOS 版的候選字面板配色（深色）
ScaleWithDPI=True

[InputPanel]
NormalColor=#dfdfdf
HighlightCandidateColor=#ffffff
HighlightColor=#ffffff
HighlightBackgroundColor=#3f638b
PageButtonAlignment=Last Candidate
FullWidthHighlight=True

[InputPanel/TextMargin]
