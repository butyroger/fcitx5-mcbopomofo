# McBopomofo Light: candidate panel colors of McBopomofo on macOS in light mode
# (the system colors its panels use). No font is set, so that the font and
# its size stay with the classic user interface settings. No images are
# shipped: the panel is drawn in plain colors, and the page, check and
# submenu marks are those of the default fcitx theme.
#
# Colors, from the macOS system colors in light mode:
#   background     popover material (#f6f6f6)
#   border         separatorColor over the background (#dddddd)
#   text           labelColor over the background (#252525)
#   highlight      controlAccentColor (#007aff) with white text, as the
#                  candidate and symbol table panels draw the chosen item;
#                  follows the desktop accent color when the classic user
#                  interface is set to follow the system accent color
#   marked text    selectedTextBackgroundColor (#b3d7ff) and
#                  selectedTextColor (#000000)

[Metadata]
Name=McBopomofo Light
Name[zh_TW]=小麥注音淺色
Version=1
Author=McBopomofo Smart Learning
Description=Candidate panel in the colors of McBopomofo on macOS, light
Description[zh_TW]=小麥注音 macOS 版的候選字面板配色（淺色）
ScaleWithDPI=True

[InputPanel]
NormalColor=#252525
HighlightCandidateColor=#ffffff
HighlightColor=#000000
HighlightBackgroundColor=#b3d7ff
PageButtonAlignment=Last Candidate
FullWidthHighlight=True

[InputPanel/TextMargin]
